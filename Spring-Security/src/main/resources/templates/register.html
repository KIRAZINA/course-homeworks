<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Spring Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="text-center mb-4">Create Account</h3>

                    <!-- Global Business Error (e.g., Duplicate Email) -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/register}" method="post" th:object="${user}">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="John Doe">
                            <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger fw-bold"></small>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" th:field="*{email}" class="form-control" id="email" placeholder="john@example.com">
                            <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger fw-bold"></small>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" th:field="*{phone}" class="form-control" id="phone" placeholder="+1234567890">
                            <small th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}" class="text-danger fw-bold"></small>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" id="password" placeholder="Minimum 6 characters">
                            <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-danger fw-bold"></small>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Register</button>
                    </form>

                    <div class="mt-3 text-center">
                        <a th:href="@{/login}">Already have an account? Login here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
